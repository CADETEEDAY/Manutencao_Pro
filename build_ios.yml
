name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar dependências do sistema e AIDL
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aidl \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libssl-dev \
            libffi-dev \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv wheel

      - name: Compilar APK com Buildozer
        run: |
          buildozer -v android debug

      - name: Enviar APK gerado para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Manutencao-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
