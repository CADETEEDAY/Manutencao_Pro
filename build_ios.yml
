name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar ferramentas de compilação
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool
          python3 -m pip install --upgrade pip
          pip install Cython kivy-ios

      - name: 4. Compilar bibliotecas base (kivy-ios)
        run: |
          # Adicione outras dependências se o app usar (ex: pillow, openssl, sqlite3)
          toolchain build python3 kivy

      - name: 5. Criar projeto Xcode
        run: |
          toolchain create ManutencaoPro .

      - name: 6. Compilar app com Xcode (Release sem assinatura)
        run: |
          cd ManutencaoPro-ios
          xcodebuild clean archive \
            -project ManutencaoPro.xcodeproj \
            -scheme ManutencaoPro \
            -configuration Release \
            -archivePath build/ManutencaoPro.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 7. Gerar pacote .IPA
        run: |
          cd ManutencaoPro-ios
          mkdir -p Payload
          cp -r build/ManutencaoPro.xcarchive/Products/Applications/*.app Payload/
          zip -r ManutencaoPro.ipa Payload
          mv ManutencaoPro.ipa ../

      - name: 8. Salvar arquivo IPA como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManutencaoPro-iOS-IPA
          path: ManutencaoPro.ipa
