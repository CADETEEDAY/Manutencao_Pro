name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar ferramentas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aidl \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libssl-dev \
            libtool \
            patch \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer "cython<3.0" virtualenv wheel

      - name: Compilar APK com Buildozer
        run: |
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

          buildozer -v android debug > build.log 2>&1 || {
            python3 -c '
          import os, re
          log_file = "build.log"
          if not os.path.exists(log_file):
              exit(1)
          with open(log_file, "r", errors="ignore") as f:
              content = f.read()

          patterns = [
              r"FAILURE: Build failed with an exception\..*?(?=\n\n\n|\Z)",
              r"\* What went wrong:.*?(?=\n\* Try:|\Z)",
              r"> Task :[^\n]* FAILED.*?(?=\n\n|\Z)",
              r"Execution failed for task.*?(?=\n\n|\Z)"
          ]
          extracted = ""
          for p in patterns:
              m = re.search(p, content, re.DOTALL)
              if m:
                  extracted = m.group(0).strip()
                  break

          if not extracted:
              lines = content.splitlines()
              cmd_idx = -1
              for i, l in enumerate(lines):
                  if "# Command failed:" in l:
                      cmd_idx = i
                      break
              if cmd_idx != -1:
                  start = max(0, cmd_idx - 60)
                  extracted = "\n".join(lines[start:cmd_idx])
              else:
                  extracted = "\n".join(lines[-60:])

          print("\n==================== [ERRO REAL DO GRADLE] ====================")
          print(extracted[:3000])
          print("===============================================================\n")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write("### 🚨 Erro do Gradle Detectado:\n```text\n" + extracted[:3000] + "\n```\n")
          '
            exit 1
          }

      - name: Enviar APK gerado para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Manutencao-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
