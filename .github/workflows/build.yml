name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # Trava no Ubuntu 22.04 para evitar quebras de bibliotecas do Ubuntu 24.04
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip curl \
            autoconf automake libtool pkg-config \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev ccache cmake

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.0.0" "buildozer==1.5.0"

      - name: Compilar APK com Buildozer
        env:
          # Anula as variáveis globais do runner (que contêm o NDK 27 incompatível)
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
        run: |
          buildozer -v android debug

      - name: Enviar APK Gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Manutencao-APK
          path: bin/*.apk
          retention-days: 14
