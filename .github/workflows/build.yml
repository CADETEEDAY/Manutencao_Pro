name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar Dependências do Sistema (Ubuntu 24.04)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip libtool autoconf automake ccache pkg-config \
            zlib1g-dev libncurses-dev libssl-dev libffi-dev build-essential

      - name: Instalar Buildozer e Cython Compatível
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Compilar APK com Buildozer
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
        run: |
          yes | buildozer android debug

      - name: Enviar APK Gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Manutencao-APK
          path: bin/*.apk
          retention-days: 14
