name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar ferramentas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aidl \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libssl-dev \
            libtool \
            patch \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Pré-configurar licenças oficiais do Android
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv wheel

      - name: Compilar APK com Buildozer
        run: |
          buildozer -v android debug

      - name: Enviar APK gerado para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Manutencao-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
