name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar ferramentas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aidl \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libssl-dev \
            libtool \
            patch \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Instalar Buildozer e Cython compativel com p4a estavel
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer "cython<3.0" virtualenv wheel

      - name: Compilar APK com Buildozer
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        run: |
          buildozer -v android debug 2>&1 | tee build.log || {
            echo "==================== [ERRO REAL DO COMPILADOR] ===================="
            grep -i -C 3 -E "fatal error:|error: |\[ERROR\]:" build.log | tail -n 50 || tail -n 50 build.log
            echo "=================================================================="
            exit 1
          }

      - name: Enviar APK gerado para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Manutencao-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
