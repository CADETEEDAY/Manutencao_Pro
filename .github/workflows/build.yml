name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ccache \
            cmake \
            libffi-dev \
            libssl-dev \
            libncurses-dev \
            zlib1g-dev \
            pkg-config \
            autoconf \
            libtool \
            zip \
            unzip

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer "Cython<3.0" virtualenv

      - name: Compilar APK com Buildozer
        run: |
          # Limpeza de variaveis do NDK que conflitam no runner
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

          # Cria uma assinatura digital fixa para que as atualizacoes instalem por cima
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"

          buildozer -v android debug

      - name: Disponibilizar APK para descarregar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Manutencao_Pro_APK
          path: bin/*.apk
