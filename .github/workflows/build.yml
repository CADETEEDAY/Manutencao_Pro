- name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip curl \
          autoconf automake libtool pkg-config \
          libffi-dev libssl-dev zlib1g-dev \
          libncurses-dev ccache

    - name: Instalar Buildozer e dependências compatíveis
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython<3.0.0" "buildozer==1.5.0" "python-for-android==2024.01.21"

    - name: Compilar APK com Buildozer
      env:
        # Deixar vazias anula as variáveis globais do runner (NDK 27)
        # e força o Buildozer a usar o NDK 25b gerenciado por ele mesmo
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK: ""
      run: |
        yes | buildozer -v android debug
