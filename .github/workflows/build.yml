name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ccache \
            cmake \
            libffi-dev \
            libssl-dev \
            libncurses-dev \
            zlib1g-dev \
            pkg-config \
            autoconf \
            libtool \
            zip \
            unzip

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer "Cython<3.0" virtualenv

      - name: Compilar APK com Buildozer
        run: |
          buildozer -v android debug

      - name: Disponibilizar APK para descarregar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Manutencao_Pro_APK
          path: bin/*.apk
